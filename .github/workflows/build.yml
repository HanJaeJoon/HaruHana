name: Android Build

on:
  # 수동 실행 전용. Actions > Android Build > Run workflow 에서 브랜치를 골라 실행한다.
  # (workflow_dispatch 워크플로는 기본 브랜치에 파일이 있어야 UI 목록에 노출된다)
  workflow_dispatch:

env:
  # 이 앱의 업로드 키 인증서 SHA-256.
  # 인증서 지문은 공개 정보이므로 저장소에 두어도 안전하다. 비밀은 키스토어와 비밀번호뿐이다.
  #
  # 값의 출처는 두 곳이고 같아야 한다.
  #   - 로컬 키스토어: keytool -list -v -keystore <upload.jks> -alias upload
  #   - Play Console > Google Play로 보호됨 > 앱 서명 > 업로드 키 인증서
  # 후자는 첫 App Bundle 을 업로드한 뒤에 생긴다. 그 전에는 전자로 채워 두고,
  # 첫 업로드 후 Play 가 보여주는 지문과 같은지 대조한다.
  #
  # 비어 있으면 서명 검증을 건너뛴다. 채우지 않으면 잘못된 키로 서명된 AAB 가
  # 조용히 통과한다.
  EXPECTED_UPLOAD_CERT_SHA256: '4C:DA:CA:9B:CD:7F:BF:8C:A3:80:E9:6B:8C:B8:5E:34:26:64:3C:F3:F1:73:04:79:85:6F:C7:D5:C2:00:DE:EE'
  AAB_PATH: android/app/build/outputs/bundle/release/app-release.aab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode 가드가 vc* 태그를 읽어야 하므로 전체 이력을 가져온다
          fetch-depth: 0

      # 서명 시크릿은 빌드 맨 뒤에서야 쓰인다. 없으면 25분을 태우고 마지막에
      # 실패하므로 여기서 먼저 막는다. 값은 출력하지 않고 열리는지만 본다.
      - name: Guard signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MISSING=
          for NAME in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            eval "VALUE=\$$NAME"
            [ -n "$VALUE" ] || MISSING="$MISSING $NAME"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::등록되지 않은 저장소 시크릿:$MISSING (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          # keytool 이 없는 러너에서는 존재 확인까지만 하고 넘어간다.
          if ! command -v keytool > /dev/null 2>&1; then
            echo "::warning::keytool 이 없어 키스토어 열기 검사를 건너뜁니다."
            exit 0
          fi
          PROBE="$RUNNER_TEMP/probe.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$PROBE" 2>/dev/null || true
          OK=1
          keytool -list -keystore "$PROBE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1 || OK=0
          rm -f "$PROBE"
          if [ "$OK" = "0" ]; then
            echo "::error::키스토어를 열지 못했습니다. ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS 를 확인하세요."
            exit 1
          fi
          echo "서명 시크릿 4개 확인 완료"

      # pnpm 버전은 package.json 의 packageManager 필드에서 읽는다
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # react-native 0.86 의 engines 는 ^20.19.4 || ^22.13.0 || ^24.3.0 || >=25 다
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 빌드에 25분을 쓰기 전에 실패해야 의미가 있으므로 앞쪽에 둔다.
      # 출시 이력은 vc<N> 형식의 git 태그로 기록한다.
      - name: Guard versionCode
        run: |
          CURRENT=$(node -p "require('./app.json').expo.android.versionCode")
          HIGHEST=$(git tag -l 'vc*' | sed 's/^vc//' | sort -n | tail -1)
          HIGHEST=${HIGHEST:-0}
          echo "app.json versionCode=$CURRENT / 출시된 최고 태그=vc$HIGHEST"
          if [ "$CURRENT" -le "$HIGHEST" ]; then
            echo "::error::versionCode $CURRENT 는 이미 출시된 vc$HIGHEST 이하입니다. app.json의 versionCode를 올리세요."
            exit 1
          fi
          echo "versionCode 검사 통과"

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:ci

      # kit -> 앱 방향 의존 금지 규칙이 여기서 강제된다 (eslint.config.js)
      - name: Lint
        run: pnpm run lint

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Expo prebuild
        run: pnpm expo prebuild --platform android --clean

      - name: Restore keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      # EXPECTED_UPLOAD_CERT_SHA256 이 비어 있으면 건너뛴다.
      # 첫 업로드 전에는 대조할 지문이 없기 때문이다.
      - name: Verify signing certificate
        run: |
          EXPECTED=$(echo "$EXPECTED_UPLOAD_CERT_SHA256" | tr -d ' \t\r')
          if [ -z "$EXPECTED" ]; then
            echo "::warning::EXPECTED_UPLOAD_CERT_SHA256 이 비어 있어 서명 검증을 건너뜁니다. Play 첫 업로드 후 워크플로에 업로드 키 지문을 채우세요."
            exit 0
          fi
          ACTUAL=$(keytool -printcert -jarfile "$AAB_PATH" \
            | grep -m1 'SHA256:' | sed 's/.*SHA256://' | tr -d ' \t\r')
          echo "기대값: $EXPECTED"
          echo "실제값: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "::error::AAB에서 서명 인증서를 읽지 못했습니다."
            exit 1
          fi
          if [ "$(echo "$ACTUAL" | tr 'a-f' 'A-F')" != "$(echo "$EXPECTED" | tr 'a-f' 'A-F')" ]; then
            echo "::error::서명 인증서가 Play 업로드 키와 일치하지 않습니다. Play에 업로드하지 마세요."
            exit 1
          fi
          echo "서명 검증 통과 - Play 업로드 키와 일치"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
